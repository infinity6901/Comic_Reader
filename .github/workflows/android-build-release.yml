name: Android CI and FOSS Releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests, lint, and build APKs
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Prepare APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ComicReader-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/ComicReader-release.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comicreader-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish FOSS Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: comicreader-apks
          path: dist

      - name: Publish APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/ComicReader-debug.apk
            dist/ComicReader-release.apk
            dist/SHA256SUMS.txt
          body: |
            ## Comic Reader FOSS Release

            - `ComicReader-release.apk`: release build for direct installation.
            - `ComicReader-debug.apk`: debuggable development build.
            - `SHA256SUMS.txt`: SHA-256 checksums for the APKs.

            The release APK must be signed using the signing configuration
            defined by the project. Builds using temporary debug keys may not
            support upgrades from APKs signed with different keys.
