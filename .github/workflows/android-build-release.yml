name: Android CI and Releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create CI-only Android debug signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<'PROPS'
          storeFile=debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          PROPS

      - name: Run unit tests, lint, and build debug/release APKs
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Prepare named APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ComicReader-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/ComicReader-release-debug-key.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comicreader-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: comicreader-apks
          path: dist

      - name: Publish APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/ComicReader-debug.apk
            dist/ComicReader-release-debug-key.apk
            dist/SHA256SUMS.txt
          body: |
            ## Build artifacts

            - `ComicReader-debug.apk`: debuggable development build.
            - `ComicReader-release-debug-key.apk`: optimized release build signed with a generated Android **debug key** for testing only.
            - `SHA256SUMS.txt`: SHA-256 checksums for the APKs.

            **Security warning:** the Android debug key uses publicly known credentials and is generated afresh by CI. This APK is not suitable for production distribution, Play Store upload, or upgrades signed with a private production key. Generate and protect a private release keystore for production releases.
